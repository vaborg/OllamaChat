name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP 8.5.2 requires JDK 17+. 17 is the version AGP is tested against.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pins Gradle explicitly. Without this the runner's own Gradle (8.2)
      # is used and AGP's version check fails. This also removes any need
      # for a committed gradle-wrapper.jar.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show toolchain
        run: gradle --version

      # ANDROID_HOME is preset on ubuntu-latest, so no local.properties needed.
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
